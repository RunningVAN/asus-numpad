[package]
name = "asus-numpad-win"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ASUS NumberPad 背光控制（Windows 图形界面）；数字键手感与行为由官方驱动保持"
license = "GPL-3.0-or-later"
repository = "https://github.com/asus-numpad/asus-numpad"
readme = "README.md"

[[bin]]
name = "asus-numpad-win"
path = "src/main.rs"

[dependencies]
# 复用 Linux 侧逻辑层：led_proto 的报文编码、led_policy 的设备排序判据、
# brightness 的档位映射都与平台无关，Windows 侧不另写一套。
asus-numpad = { path = "..", version = "1.0.3" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    # 只在 Windows 上正式发布；x11/wayland 是为了让 Linux CI 能编译同一个包，
    # 二者都通过 dlopen 访问系统库，不增加链接期依赖。
    "x11",
    "wayland",
] }
ab_glyph = "0.2"

# 只用系统自带的 HID 用户态接口（setupapi + hid.dll），不装内核驱动、
# 不接管输入：数字键仍由 ASUS 官方驱动处理，本程序只写 FEATURE 0x0d。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
