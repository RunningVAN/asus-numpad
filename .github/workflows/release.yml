name: release

# 推 v* 标签即发版：
#   1. 各发行版容器里出包（deb / rpm / apk / arch / 静态 tarball）
#   2. 汇总成 APT / RPM / Pacman / Alpine 四套仓库，写入 main 的 repo/
#   3. 全部产物挂到 GitHub Release
#
# 用户侧的软件源地址见 docs/install.md。
#
# 出包一律走 `docker run` 而不是 job 级 container：Alpine/Arch 容器里没有 glibc，
# actions/checkout 这类 JS action 跑不起来；源码用只读方式挂进去，在容器内复制一份
# 再编译，宿主目录的属主和权限就不会被容器里的 root/builder 弄脏。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v）
        required: true
        default: 1.1.1

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成锁文件（若还没有）
        run: if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo clippy（-D warnings）
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
      - name: cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x -S warning \
            packaging/build.sh packaging/lib/common.sh \
            packaging/deb/make-deb.sh packaging/rpm/make-rpm.sh \
            packaging/arch/make-arch.sh packaging/arch/PKGBUILD \
            packaging/arch/asus-numpad.install packaging/build-skus.sh \
            packaging/install-sku.sh tools/repo-gen.sh \
            packaging/tarball/make-tarball.sh packaging/alpine/make-alpine.sh
      - name: shellcheck（POSIX sh 部分）
        run: |
          shellcheck -s sh -S warning \
            packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm \
            packaging/tarball/install.sh packaging/tarball/uninstall.sh \
            packaging/alpine/asus-numpad.post-install

  # 各发行版在自己的容器里出包。容器常驻、分阶段跑，是为了让失败落在 step 名上：
  # 拿不到 Actions 日志时，step 名就是唯一线索。每个阶段的输出都 tee 到 logs/，
  # 由 diagnose job 汇总后推到一个分支，便于事后复盘。
  package:
    needs: test
    runs-on: ubuntu-latest
    # 这里刻意不写 job 级 continue-on-error：它会把 job 的 conclusion 改成 success，
    # 下游 publish 的 needs.package.result == 'success' 就成了摆设，
    # 「缺 arch 包也照样发版」这种事故会被直接放行。
    # matrix 之间已用 fail-fast: false 保证互不打断，不需要额外容错。
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 编出来的包是 apt 仓库的「通用基线」：glibc 2.35，
          # 装得上 22.04 / 24.04、Debian 12 / 13——取这条线里最老的一个当基线，
          # 才不会出现「新版能装、老版报 GLIBC_2.38 not found」。
          - name: deb-ubuntu-jammy
            image: ubuntu:22.04
            deps: &apt-deps |
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates dpkg-dev fakeroot build-essential
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            build: bash ./packaging/deb/make-deb.sh --out dist
          # 另外两条线各出一个带发行版标签的包（版本号加 ~noble / ~bookworm），
          # 只挂在 Release 里给愿意用「原生编译」版本的人，不进 apt 仓库。
          - name: deb-ubuntu-noble
            image: ubuntu:24.04
            deps: *apt-deps
            build: bash ./packaging/deb/make-deb.sh --distro noble --out dist
          - name: deb-debian
            image: debian:trixie
            deps: *apt-deps
            build: bash ./packaging/deb/make-deb.sh --distro trixie --out dist
          - name: deb-debian-bookworm
            image: debian:bookworm
            deps: *apt-deps
            build: bash ./packaging/deb/make-deb.sh --distro bookworm --out dist
          # 一套 spec 同时覆盖 Fedora / RHEL / openSUSE：不依赖发行版私有宏。
          # RHEL 9 的 glibc 2.34 是三条线里最老的，它编出来的包就是 rpm 仓库的
          # 「通用基线」；Fedora 与 openSUSE 的包带各自的 %dist 标记，只挂 Release。
          - name: rpm-el9
            image: almalinux:9
            deps: |
              set -eux
              dnf install -y 'dnf-command(config-manager)' || true
              dnf install -y epel-release || true
              dnf install -y cargo rust gcc gcc-c++ make rpm-build systemd-rpm-macros tar gzip
            build: bash ./packaging/rpm/make-rpm.sh --out dist
          - name: rpm-fedora
            image: fedora:latest
            deps: |
              set -eux
              dnf install -y cargo rust gcc gcc-c++ make rpm-build systemd-rpm-macros tar gzip
            build: bash ./packaging/rpm/make-rpm.sh --out dist
          - name: rpm-opensuse
            image: opensuse/tumbleweed:latest
            deps: |
              set -eux
              zypper --non-interactive install --no-recommends cargo rust gcc gcc-c++ make rpm-build tar gzip
            # openSUSE 的 rpmbuild 不带 %dist 宏，默认会得到 asus-numpad-<ver>-1.x86_64.rpm，
            # 和别的源混在一起看不出是给谁的；显式写进 Release 段
            build: bash ./packaging/rpm/make-rpm.sh --release 1.suse --out dist
          - name: arch
            image: archlinux:latest
            deps: |
              set -eux
              pacman -Syu --noconfirm --needed base-devel rust sudo libarchive
              id builder >/dev/null 2>&1 || useradd -m builder
              mkdir -p /etc/sudoers.d
              echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /build
            build: su builder -c 'cd /build && bash ./packaging/arch/make-arch.sh --out dist'
          - name: alpine
            image: alpine:latest
            deps: |
              set -eux
              apk add --no-cache alpine-sdk cargo rust bash tar gzip sudo
              id builder >/dev/null 2>&1 || adduser -D builder
              # abuild 要求执行者在 abuild 组里，否则第一步建依赖就报
              # "User builder is not a member of group abuild"
              addgroup builder abuild
              mkdir -p /etc/sudoers.d
              echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              su builder -c 'export HOME=/home/builder; abuild-keygen -a -i -n' || true
              chown -R builder:builder /build
            # abuild 不接受 root 运行，且必须有自己的签名密钥，都放在 builder 下
            build: su builder -c 'export HOME=/home/builder; cd /build && bash ./packaging/alpine/make-alpine.sh --out dist'

    steps:
      - uses: actions/checkout@v4
      - name: 建日志目录
        run: mkdir -p logs

      - name: 起容器并复制源码（${{ matrix.name }}）
        run: |
          set -euo pipefail
          docker rm -f npbuild >/dev/null 2>&1 || true
          docker create --name npbuild -v "$PWD:/src:ro" "${{ matrix.image }}" sleep 3600 >/dev/null
          docker start npbuild >/dev/null
          # 源码只读挂入、容器内复制一份：容器里的 root/builder 碰不到宿主文件
          docker exec npbuild sh -c 'mkdir -p /build && cp -a /src/. /build/' 2>&1 | tee logs/01-copy.log

      - name: 装构建依赖（${{ matrix.name }}）
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPS" > deps.sh
          docker cp deps.sh npbuild:/deps.sh
          docker exec npbuild sh /deps.sh 2>&1 | tee logs/02-deps.log
        env:
          DEPS: ${{ matrix.deps }}

      - name: 编译并出包（${{ matrix.name }}）
        run: |
          set -o pipefail
          docker exec -w /build npbuild bash -c "$BUILD" 2>&1 | tee logs/03-build.log
        env:
          BUILD: ${{ matrix.build }}

      - name: 收集产物（${{ matrix.name }}）
        run: |
          set -euo pipefail
          mkdir -p dist
          docker cp npbuild:/build/dist/. dist/
          ls -l dist

      - name: 容器日志（${{ matrix.name }}）
        if: always()
        run: |
          docker logs npbuild > logs/04-docker.log 2>&1 || true
          # 出包失败时把容器内日志整段贴到 Actions 输出里：公开仓库的日志
          # 无需 token 即可阅读，省掉「下载 artifact 才能复盘」这一步。
          if true; then
            echo "=== 出包日志（${{ matrix.name }}）==="
            for f in logs/*.log; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              tail -n 120 "$f"
            done
          fi

      - name: 保存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # 出包成功不等于装得上。这里在每个目标发行版里真装一遍再跑 --version：
  # 基线包（jammy 编的 deb、el9 编的 rpm）会装到更老的系统上，
  # glibc 版本没兜住的话，这一步会以 "GLIBC_2.xx not found" 直接红。
  install-check:
    name: 安装验证 (${{ matrix.name }})
    needs: [package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-12,     image: debian:12,                  artifact: pkg-deb-ubuntu-jammy, pick: '\.deb$' }
          - { name: ubuntu-22.04,  image: ubuntu:22.04,               artifact: pkg-deb-ubuntu-jammy, pick: '\.deb$' }
          - { name: ubuntu-24.04,  image: ubuntu:24.04,               artifact: pkg-deb-ubuntu-jammy, pick: '\.deb$' }
          - { name: debian-trixie, image: debian:trixie,              artifact: pkg-deb-ubuntu-jammy, pick: '\.deb$' }
          - { name: almalinux-9,   image: almalinux:9,                artifact: pkg-rpm-el9,          pick: '\.rpm$' }
          - { name: fedora,        image: fedora:latest,              artifact: pkg-rpm-fedora,       pick: '\.rpm$' }
          - { name: opensuse,      image: opensuse/tumbleweed:latest, artifact: pkg-rpm-opensuse,     pick: '\.rpm$' }
          - { name: arch,          image: archlinux:latest,           artifact: pkg-arch,             pick: 'asus-numpad-[0-9].*pkg\.tar\.zst$' }
          - { name: alpine,        image: alpine:latest,              artifact: pkg-alpine,           pick: 'asus-numpad-[0-9].*apk$' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: 装包并执行（${{ matrix.name }}）
        run: |
          set -o pipefail
          if ! docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" sh -c '
            set -eux
            cd /dist
            pkg=$(ls | grep -E "${{ matrix.pick }}" | head -n 1)
            echo "待装包: $pkg"
            case "$pkg" in
              *.deb)
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends "./$pkg"
                ;;
              *.rpm)
                if command -v dnf >/dev/null 2>&1; then
                  dnf install -y --nogpgcheck "./$pkg"
                else
                  # openSUSE 上不走 zypper：它装本地包前会先 refresh 全部软件源，
                  # 容器里常常卡在这一步。rpm 直接装本地包，依赖照样校验。
                  rpm -Uvh --nosignature --replacepkgs "./$pkg"
                fi
                ;;
              *.pkg.tar.*)
                pacman -Sy --noconfirm --needed glibc >/dev/null 2>&1 || true
                pacman -U --noconfirm "./$pkg"
                ;;
              *.apk)
                apk add --no-cache --allow-untrusted "./$pkg"
                ;;
            esac
            echo "--- 版本 ---"
            asus-numpad --version
            echo "--- 命令可用 ---"
            asus-numpad --help >/dev/null
            echo "--- udev 规则已落地 ---"
            # 不用 find：openSUSE 的精简镜像里连 find 都没有
            hit=0
            for d in /usr/lib/udev/rules.d /lib/udev/rules.d /usr/local/lib/udev/rules.d; do
              if [ -f "$d/99-asus-numpad.rules" ]; then echo "规则: $d/99-asus-numpad.rules"; hit=1; fi
            done
            [ "$hit" = 1 ]
            echo "OK: 装得上、跑得起来"
          ' 2>&1 | tee /tmp/install.log; then
            # 失败时把原因打成 annotation：公开仓库不用登录也能看到
            grep -aE "错误|失败|Error|error|failed|not found|No such|denied|conflict|依赖" /tmp/install.log \
              | tail -n 15 | cut -c1-800 | while IFS= read -r line; do
                echo "::error::[${{ matrix.name }}] $line"
              done
            echo "---- tail ----"
            tail -n 40 /tmp/install.log | cut -c1-800 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

  # Actions 日志在没有 token 的情况下读不到，把出包日志推回一个分支才能复盘。
  diagnose:
    needs: [package]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
      # 不能 merge-multiple：每个 matrix 的日志文件名都一样（01-copy.log…），
      # 合并后只会剩下最后写进去的那份，复盘时就变成拿着 fedora 的日志查 arch 的错。
      - name: 汇总
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          cp -a logs/. ci-logs/ 2>/dev/null || true
          find ci-logs -type f | sort
      - name: 推到 ci-logs 分支
        run: |
          set -euo pipefail
          # 日志目录空时直接退出：否则 orphan 分支上的空提交会把上一次的日志冲掉
          if [ ! -d ci-logs ] || [ -z "$(find ci-logs -type f -print -quit)" ]; then
            echo "没有日志可推，保持 ci-logs 分支不动"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git add -A ci-logs
          git commit -m "ci: 出包日志 ${{ github.run_id }}" || echo "无日志"
          git push -f origin HEAD:ci-logs

  # 静态 tarball 单独出：musl 目标在宿主上比在容器里好搞
  tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: 出静态 tarball
        run: ./packaging/tarball/make-tarball.sh --static --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  # 汇总：生成四套仓库索引 → 发 Release → 提交 repo/ 回 main
  publish:
    needs: [package, tarball, install-check]
    if: needs.package.result == 'success' && needs.tarball.result == 'success' && needs.install-check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 计算版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本 $V"
          ls -l dist

      # 同一次发版里有多个发行版编出来的同类包（4 个 deb、3 个 rpm）。
      # 仓库只能收一份：收「基线」——取编译环境 glibc 最老的那个，
      # 这样 22.04 编的 deb 能装 22.04~24.04 与 Debian 12/13，el9 编的 rpm
      # 能装 RHEL 9/10、Fedora、openSUSE。其余发行版原生包只挂 Release。
      - name: 分出基线包与发行版专用包
        run: |
          set -euo pipefail
          mkdir -p baseline extras
          shopt -s nullglob
          debs=(dist/*.deb)
          rpms=(dist/*.rpm)
          if [ "${#debs[@]}" -ne 1 ] && [ "${#debs[@]}" -gt 0 ]; then
            # 多于一个「无发行版后缀」的 deb 说明基线不唯一，宁可停下也不发错源
            base_count=0
            for f in "${debs[@]}"; do
              case "$f" in *~*) ;; *) base_count=$((base_count + 1)) ;; esac
            done
            if [ "$base_count" -ne 1 ]; then
              echo "dist 里的 deb：${debs[*]}"
              echo "::error::apt 基线 deb 不唯一（$base_count 个），检查 matrix 的 --distro 参数"
              exit 1
            fi
          fi
          for f in "${debs[@]}"; do
            case "$f" in *~*) mv "$f" extras/ ;; *) mv "$f" baseline/ ;; esac
          done
          echo "dist 里的 rpm：${rpms[*]:-无}"
          el9=0
          for f in "${rpms[@]}"; do
            # 注意 rpm 名是 asus-numpad-<ver>-1.el9.x86_64.rpm，el9 在中间，
            # 用 *el9*.rpm 而不是 *.el9.rpm
            case "$f" in
              *el9*.rpm) mv "$f" baseline/; el9=$((el9 + 1)) ;;
              *)         mv "$f" extras/ ;;
            esac
          done
          if [ "$el9" -ne 1 ]; then
            echo "::error::rpm 基线包（*el9*.rpm）应恰好 1 个，实际 $el9 个"
            exit 1
          fi
          mv dist/*.pkg.tar.* dist/*.apk dist/*.tar.gz baseline/ 2>/dev/null || true
          echo "基线："; ls -1 baseline
          echo "发行版专用："; ls -1 extras

      - name: 装索引工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev createrepo-c ca-certificates

      # repo-add / apk 是 Arch 与 Alpine 专属工具，临时借容器跑，
      # 免得为了两条索引命令把整个 job 搬进容器
      - name: 借容器提供 repo-add 与 apk
        run: |
          set -euo pipefail
          mkdir -p "$HOME/shim"
          cat > "$HOME/shim/repo-add" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/w" -w /w archlinux:latest \
            bash -c 'pacman -Sy --noconfirm --needed pacman-contrib >/dev/null 2>&1; repo-add "$@"' _ "$@"
          SH
          cat > "$HOME/shim/apk" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/w" -w /w alpine:latest apk "$@"
          SH
          chmod +x "$HOME/shim/repo-add" "$HOME/shim/apk"
          echo "$HOME/shim" >> "$GITHUB_PATH"

      - name: 校验产物齐全（缺任何一类就不发版）
        run: |
          set -euo pipefail
          missing=0
          check() { # $1 名字  $2 匹配式
            if compgen -G "baseline/$2" >/dev/null || compgen -G "extras/$2" >/dev/null; then
              echo "OK   $1: $(compgen -G "baseline/$2" | wc -l | tr -d ' ')/$(compgen -G "extras/$2" | wc -l | tr -d ' ') 个（基线/专用）"
            else
              echo "MISS $1（base+extras/$2）"
              missing=1
            fi
          }
          check deb  '*.deb'
          check rpm  '*.rpm'
          check arch '*.pkg.tar.*'
          check apk  '*.apk'
          check tar  '*.tar.gz'
          if [ "$missing" -ne 0 ]; then
            echo "::error::产物不全，不发版（先看 ci-logs 分支里的出包日志）"
            exit 1
          fi

      - name: 生成仓库
        run: |
          set -o pipefail
          # 失败时把最后几十行打成 annotation，公开可查，不必登录看日志
          if ! bash -x ./tools/repo-gen.sh --dist baseline --out repo --keep 3 2>&1 | tee /tmp/repo-gen.log; then
            echo "::error::repo-gen.sh 失败，关键行与尾部输出如下"
            { grep -aE "错误|失败|unrecognized|not found|No such|denied|fatal|invalid" /tmp/repo-gen.log | tail -n 20
              echo "---- tail ----"
              tail -n 60 /tmp/repo-gen.log
            } | cut -c1-900 | while IFS= read -r line; do
              echo "::error::RG| $line"
            done
            exit 1
          fi

      - name: 校验索引没丢东西
        run: |
          set -e
          ls -l repo
          test -f repo/apt/dists/stable/Release
          test -f repo/rpm/x86_64/repodata/repomd.xml
          test -f repo/arch/x86_64/asus-numpad.db.tar.gz
          test -f repo/alpine/x86_64/APKINDEX.tar.gz

      - name: 生成校验和
        run: |
          ( for d in baseline extras; do ( cd "$d" && sha256sum ./* 2>/dev/null ); done \
              | grep -v SHA256SUMS > extras/asus-numpad-${{ steps.ver.outputs.version }}-SHA256SUMS || true )

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" baseline/* extras/* --clobber
            # 重打 tag 时旧 Release 会失去 tag 关联、退化成草稿（网页上看不到），
            # 这里强制把它绑回当前 tag 并置为已发布。
            gh release edit "v$V" --tag "v$V" --draft=false
          elif [ -f CHANGELOG.md ]; then
            gh release create "v$V" baseline/* extras/* --title "asus-numpad $V" \
              --notes-file CHANGELOG.md --target main
          else
            gh release create "v$V" baseline/* extras/* --title "asus-numpad $V" \
              --generate-notes --target main
          fi

      - name: 把 repo/ 提交回 main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repo
          if git diff --cached --quiet; then
            echo "repo/ 无变化"
          else
            git commit -m "chore(repo): 更新软件源索引至 ${{ steps.ver.outputs.version }}"
            git push origin HEAD:main
          fi
