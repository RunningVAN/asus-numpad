name: release

# 推 v* 标签即发版：
#   1. 各发行版容器里出包（deb / rpm / apk / arch / 静态 tarball）
#   2. 汇总成 APT / RPM / Pacman / Alpine 四套仓库，写入 main 的 repo/
#   3. 全部产物挂到 GitHub Release
#
# 用户侧的软件源地址见 docs/install.md。
#
# 出包一律走 `docker run` 而不是 job 级 container：Alpine/Arch 容器里没有 glibc，
# actions/checkout 这类 JS action 跑不起来；源码用只读方式挂进去，在容器内复制一份
# 再编译，宿主目录的属主和权限就不会被容器里的 root/builder 弄脏。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v）
        required: true
        default: 1.1.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成锁文件（若还没有）
        run: if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo clippy（-D warnings）
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
      - name: cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x -S warning \
            packaging/build.sh packaging/lib/common.sh \
            packaging/deb/make-deb.sh packaging/rpm/make-rpm.sh \
            packaging/arch/make-arch.sh packaging/arch/PKGBUILD \
            packaging/arch/asus-numpad.install packaging/build-skus.sh \
            packaging/install-sku.sh tools/repo-gen.sh \
            packaging/tarball/make-tarball.sh packaging/alpine/make-alpine.sh
      - name: shellcheck（POSIX sh 部分）
        run: |
          shellcheck -s sh -S warning \
            packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm \
            packaging/tarball/install.sh packaging/tarball/uninstall.sh \
            packaging/alpine/asus-numpad.post-install

  # 各发行版在自己的容器里出包。容器常驻、分阶段跑，是为了让失败落在 step 名上：
  # 拿不到 Actions 日志时，step 名就是唯一线索。每个阶段的输出都 tee 到 logs/，
  # 由 diagnose job 汇总后推到一个分支，便于事后复盘。
  package:
    needs: test
    runs-on: ubuntu-latest
    # 这里刻意不写 job 级 continue-on-error：它会把 job 的 conclusion 改成 success，
    # 下游 publish 的 needs.package.result == 'success' 就成了摆设，
    # 「缺 arch 包也照样发版」这种事故会被直接放行。
    # matrix 之间已用 fail-fast: false 保证互不打断，不需要额外容错。
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deb-debian
            image: debian:bookworm
            deps: |
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates dpkg-dev fakeroot build-essential
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            build: bash ./packaging/deb/make-deb.sh --out dist
          - name: deb-ubuntu
            image: ubuntu:24.04
            deps: |
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates dpkg-dev build-essential
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            build: bash ./packaging/deb/make-deb.sh --out dist
          # 一套 spec 同时覆盖 Fedora 与 openSUSE：不依赖发行版私有宏
          - name: rpm-fedora
            image: fedora:latest
            deps: |
              set -eux
              dnf install -y cargo rust rpm-build systemd-rpm-macros tar gzip
            build: bash ./packaging/rpm/make-rpm.sh --out dist
          - name: rpm-opensuse
            image: opensuse/tumbleweed:latest
            deps: |
              set -eux
              zypper --non-interactive install --no-recommends cargo rust rpm-build tar gzip
            build: bash ./packaging/rpm/make-rpm.sh --out dist
          - name: arch
            image: archlinux:latest
            deps: |
              set -eux
              pacman -Syu --noconfirm --needed base-devel rust sudo bsdtar libarchive
              id builder >/dev/null 2>&1 || useradd -m builder
              mkdir -p /etc/sudoers.d
              echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /build
            build: su builder -c 'cd /build && bash ./packaging/arch/make-arch.sh --out dist'
          - name: alpine
            image: alpine:latest
            deps: |
              set -eux
              apk add --no-cache alpine-sdk cargo rust bash tar gzip sudo
              id builder >/dev/null 2>&1 || adduser -D builder
              mkdir -p /etc/sudoers.d
              echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              su builder -c 'export HOME=/home/builder; abuild-keygen -a -i -n' || true
              chown -R builder:builder /build
            # abuild 不接受 root 运行，且必须有自己的签名密钥，都放在 builder 下
            build: su builder -c 'export HOME=/home/builder; cd /build && bash ./packaging/alpine/make-alpine.sh --out dist'

    steps:
      - uses: actions/checkout@v4
      - name: 建日志目录
        run: mkdir -p logs

      - name: 起容器并复制源码（${{ matrix.name }}）
        run: |
          set -euo pipefail
          docker rm -f npbuild >/dev/null 2>&1 || true
          docker create --name npbuild -v "$PWD:/src:ro" "${{ matrix.image }}" sleep 3600 >/dev/null
          docker start npbuild >/dev/null
          # 源码只读挂入、容器内复制一份：容器里的 root/builder 碰不到宿主文件
          docker exec npbuild sh -c 'mkdir -p /build && cp -a /src/. /build/' 2>&1 | tee logs/01-copy.log

      - name: 装构建依赖（${{ matrix.name }}）
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPS" > deps.sh
          docker cp deps.sh npbuild:/deps.sh
          docker exec npbuild sh /deps.sh 2>&1 | tee logs/02-deps.log
        env:
          DEPS: ${{ matrix.deps }}

      - name: 编译并出包（${{ matrix.name }}）
        run: |
          set -o pipefail
          docker exec -w /build npbuild bash -c "$BUILD" 2>&1 | tee logs/03-build.log
        env:
          BUILD: ${{ matrix.build }}

      - name: 收集产物（${{ matrix.name }}）
        run: |
          set -euo pipefail
          mkdir -p dist
          docker cp npbuild:/build/dist/. dist/
          ls -l dist

      - name: 容器日志（${{ matrix.name }}）
        if: always()
        run: docker logs npbuild > logs/04-docker.log 2>&1 || true

      - name: 保存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Actions 日志在没有 token 的情况下读不到，把出包日志推回一个分支才能复盘。
  diagnose:
    needs: [package]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
      # 不能 merge-multiple：每个 matrix 的日志文件名都一样（01-copy.log…），
      # 合并后只会剩下最后写进去的那份，复盘时就变成拿着 fedora 的日志查 arch 的错。
      - name: 汇总
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          cp -a logs/. ci-logs/ 2>/dev/null || true
          find ci-logs -type f | sort
      - name: 推到 ci-logs 分支
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git add -A ci-logs
          git commit -m "ci: 出包日志 ${{ github.run_id }}" || echo "无日志"
          git push -f origin HEAD:ci-logs

  # 静态 tarball 单独出：musl 目标在宿主上比在容器里好搞
  tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: 出静态 tarball
        run: ./packaging/tarball/make-tarball.sh --static --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  # 汇总：生成四套仓库索引 → 发 Release → 提交 repo/ 回 main
  publish:
    needs: [package, tarball]
    if: needs.package.result == 'success' && needs.tarball.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 计算版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本 $V"
          ls -l dist

      - name: 装索引工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev createrepo-c ca-certificates

      # repo-add / apk 是 Arch 与 Alpine 专属工具，临时借容器跑，
      # 免得为了两条索引命令把整个 job 搬进容器
      - name: 借容器提供 repo-add 与 apk
        run: |
          set -euo pipefail
          mkdir -p "$HOME/shim"
          cat > "$HOME/shim/repo-add" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/w" -w /w archlinux:latest \
            bash -c 'pacman -Sy --noconfirm --needed pacman-contrib >/dev/null 2>&1; repo-add "$@"' _ "$@"
          SH
          cat > "$HOME/shim/apk" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/w" -w /w alpine:latest apk "$@"
          SH
          chmod +x "$HOME/shim/repo-add" "$HOME/shim/apk"
          echo "$HOME/shim" >> "$GITHUB_PATH"

      - name: 校验产物齐全（缺任何一类就不发版）
        run: |
          set -euo pipefail
          missing=0
          check() { # $1 名字  $2 匹配式
            if compgen -G "dist/$2" >/dev/null; then
              echo "OK   $1: $(compgen -G "dist/$2" | wc -l | tr -d ' ') 个"
            else
              echo "MISS $1（dist/$2）"
              missing=1
            fi
          }
          check deb  '*.deb'
          check rpm  '*.rpm'
          check arch '*.pkg.tar.*'
          check apk  '*.apk'
          check tar  '*.tar.gz'
          if [ "$missing" -ne 0 ]; then
            echo "::error::产物不全，不发版（先看 ci-logs 分支里的出包日志）"
            exit 1
          fi

      - name: 生成仓库
        run: ./tools/repo-gen.sh --dist dist --out repo --keep 3

      - name: 校验索引没丢东西
        run: |
          set -e
          ls -l repo
          test -f repo/apt/dists/stable/Release
          test -f repo/rpm/x86_64/repodata/repomd.xml
          test -f repo/arch/x86_64/asus-numpad.db.tar.gz
          test -f repo/alpine/x86_64/APKINDEX.tar.gz

      - name: 生成校验和
        run: |
          ( cd dist && sha256sum ./* 2>/dev/null | grep -v SHA256SUMS > SHA256SUMS || true )
          cp dist/SHA256SUMS "dist/asus-numpad-${{ steps.ver.outputs.version }}-SHA256SUMS"

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          elif [ -f CHANGELOG.md ]; then
            gh release create "v$V" dist/* --title "asus-numpad $V" \
              --notes-file CHANGELOG.md --target main
          else
            gh release create "v$V" dist/* --title "asus-numpad $V" \
              --generate-notes --target main
          fi

      - name: 把 repo/ 提交回 main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repo
          if git diff --cached --quiet; then
            echo "repo/ 无变化"
          else
            git commit -m "chore(repo): 更新软件源索引至 ${{ steps.ver.outputs.version }}"
            git push origin HEAD:main
          fi
