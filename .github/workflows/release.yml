name: release

# 推 v* 标签即发版：
#   1. 各发行版容器里出包（deb / rpm / apk / arch / 静态 tarball）
#   2. 汇总成 APT / RPM / Pacman / Alpine 四套仓库，写入 main 的 repo/
#   3. 全部产物挂到 GitHub Release
#
# 用户侧的软件源地址见 docs/install.md。
#
# 出包一律走 `docker run` 而不是 job 级 container：Alpine/Arch 容器里没有 glibc，
# actions/checkout 这类 JS action 跑不起来；源码用只读方式挂进去，在容器内复制一份
# 再编译，宿主目录的属主和权限就不会被容器里的 root/builder 弄脏。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v）
        required: true
        default: 1.1.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成锁文件（若还没有）
        run: if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo clippy（correctness 门槛）
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D clippy::correctness
      - name: cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x -S warning \
            packaging/build.sh packaging/lib/common.sh \
            packaging/deb/make-deb.sh packaging/rpm/make-rpm.sh \
            packaging/arch/make-arch.sh packaging/arch/PKGBUILD \
            packaging/arch/asus-numpad.install packaging/build-skus.sh \
            packaging/install-sku.sh tools/repo-gen.sh \
            packaging/tarball/make-tarball.sh packaging/alpine/make-alpine.sh
      - name: shellcheck（POSIX sh 部分）
        run: |
          shellcheck -s sh -S warning \
            packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm \
            packaging/tarball/install.sh packaging/tarball/uninstall.sh \
            packaging/alpine/asus-numpad.post-install

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deb-debian
            image: debian:bookworm
            build: |
              apt-get update
              apt-get install -y --no-install-recommends cargo rustc dpkg-dev fakeroot ca-certificates
              ./packaging/deb/make-deb.sh --out dist
            glob: "dist/*.deb,dist/*.ddeb"
          - name: deb-ubuntu
            image: ubuntu:24.04
            build: |
              apt-get update
              apt-get install -y --no-install-recommends cargo rustc dpkg-dev ca-certificates
              ./packaging/deb/make-deb.sh --out dist
            glob: "dist/*.deb"
          # rpm 同时覆盖 Fedora 与 openSUSE：spec 里不用发行版私有宏
          - name: rpm-fedora
            image: fedora:latest
            build: |
              dnf install -y cargo rust rpm-build systemd-rpm-macros
              ./packaging/rpm/make-rpm.sh --out dist
            glob: "dist/*.rpm"
          - name: rpm-opensuse
            image: opensuse/tumbleweed:latest
            build: |
              zypper --non-interactive install --no-recommends cargo rust rpm-build
              ./packaging/rpm/make-rpm.sh --out dist
            glob: "dist/*.rpm"
          - name: arch
            image: archlinux:latest
            build: |
              pacman -Syu --noconfirm --needed base-devel rust sudo bsdtar
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              chown -R builder:builder /build
              su builder -c 'cd /build && ./packaging/arch/make-arch.sh --out dist'
            glob: "dist/*.pkg.tar.*"
          - name: alpine
            image: alpine:latest
            build: |
              apk add --no-cache alpine-sdk cargo rust bash tar gzip
              adduser -D builder
              echo 'builder ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              chown -R builder /build
              # abuild 必须有自己的签名密钥，否则连本地包都不让出
              su builder -c 'export HOME=/home/builder; abuild-keygen -a -i -n >/dev/null 2>&1 || true'
              su builder -c 'export HOME=/home/builder; cd /build && ./packaging/alpine/make-alpine.sh --out dist'
            glob: "dist/*.apk"

    steps:
      - uses: actions/checkout@v4
      - name: 容器内出包（${{ matrix.name }}）
        run: |
          set -euo pipefail
          docker rm -f asus-numpad-build >/dev/null 2>&1 || true

          # 源码只读挂入，容器内复制一份再编译：容器里的 root/builder 碰不到宿主文件
          cat > inner.sh <<'INNER'
          set -eux
          mkdir -p /build
          cp -a /src/. /build/
          cd /build
          INNER
          cat >> inner.sh <<INNER
          ${{ matrix.build }}
          INNER

          docker run --name asus-numpad-build \
            -v "$PWD:/src:ro" -v "$PWD/inner.sh:/inner.sh:ro" \
            "${{ matrix.image }}" bash /inner.sh

          mkdir -p dist
          docker cp asus-numpad-build:/build/dist/. dist/
          docker rm -f asus-numpad-build
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # 静态 tarball 单独出：musl 目标在宿主上比在容器里好搞
  tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: 出静态 tarball
        run: ./packaging/tarball/make-tarball.sh --static --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  # 汇总：生成四套仓库索引 → 发 Release → 提交 repo/ 回 main
  publish:
    needs: [package, tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 计算版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本 $V"
          ls -l dist

      - name: 装索引工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev createrepo-c ca-certificates

      # repo-add / apk 是 Arch 与 Alpine 专属工具，临时借容器跑，
      # 免得为了两条索引命令把整个 job 搬进容器
      - name: 借容器提供 repo-add 与 apk
        run: |
          set -euo pipefail
          mkdir -p "$HOME/shim"
          cat > "$HOME/shim/repo-add" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/w" -w /w archlinux:latest \
            bash -c 'pacman -Sy --noconfirm --needed pacman-contrib >/dev/null 2>&1; repo-add "$@"' _ "$@"
          SH
          cat > "$HOME/shim/apk" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -v "$PWD:/w" -w /w alpine:latest apk "$@"
          SH
          chmod +x "$HOME/shim/repo-add" "$HOME/shim/apk"
          echo "$HOME/shim" >> "$GITHUB_PATH"

      - name: 生成仓库
        run: ./tools/repo-gen.sh --dist dist --out repo --keep 3

      - name: 校验索引没丢东西
        run: |
          set -e
          ls -l repo
          test -f repo/apt/dists/stable/Release
          test -f repo/rpm/x86_64/repodata/repomd.xml
          test -f repo/arch/x86_64/asus-numpad.db.tar.gz
          test -f repo/alpine/x86_64/APKINDEX.tar.gz

      - name: 生成校验和
        run: |
          ( cd dist && sha256sum ./* 2>/dev/null | grep -v SHA256SUMS > SHA256SUMS || true )
          cp dist/SHA256SUMS "dist/asus-numpad-${{ steps.ver.outputs.version }}-SHA256SUMS"

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          elif [ -f CHANGELOG.md ]; then
            gh release create "v$V" dist/* --title "asus-numpad $V" \
              --notes-file CHANGELOG.md --target main
          else
            gh release create "v$V" dist/* --title "asus-numpad $V" \
              --generate-notes --target main
          fi

      - name: 把 repo/ 提交回 main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repo
          if git diff --cached --quiet; then
            echo "repo/ 无变化"
          else
            git commit -m "chore(repo): 更新软件源索引至 ${{ steps.ver.outputs.version }}"
            git push origin HEAD:main
          fi
