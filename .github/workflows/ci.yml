name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 逻辑层不依赖 Linux，单测在这里跑最快
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成锁文件（若仓库里还没有）
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: cargo test
        run: cargo test --all-targets
      - name: shellcheck 打包脚本
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x -S warning \
              packaging/build.sh packaging/build-skus.sh packaging/install-sku.sh \
              packaging/lib/common.sh \
              packaging/deb/make-deb.sh packaging/rpm/make-rpm.sh packaging/arch/make-arch.sh \
              packaging/alpine/make-alpine.sh packaging/tarball/make-tarball.sh \
              packaging/arch/PKGBUILD packaging/arch/asus-numpad.install \
              packaging/alpine/APKBUILD \
              tools/repo-gen.sh
      - name: shellcheck 维护脚本（POSIX sh）
        run: shellcheck -s sh -S warning packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
      # 只把 correctness 级别当门槛，样式类提示留给后续清理
      - name: cargo clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
      - name: cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  # 每个发行版在自己的容器里出包，这是最贴近用户的验证方式
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 发行版自带的 rustc 版本不可控（debian bookworm 只有 1.63，低于 MSRV 1.75），
          # 出包这条线统一用 rustup 装 stable，与 release 走同一套环境。
          - distro: debian
            image: debian:bookworm
            setup: >-
              apt-get update &&
              apt-get install -y --no-install-recommends
              curl ca-certificates dpkg-dev fakeroot build-essential &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable &&
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            target: deb
          - distro: ubuntu
            image: ubuntu:24.04
            setup: >-
              apt-get update &&
              apt-get install -y --no-install-recommends
              curl ca-certificates dpkg-dev build-essential &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable &&
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            target: deb
          - distro: fedora
            image: fedora:latest
            setup: >-
              dnf install -y curl ca-certificates rpm-build systemd-rpm-macros tar gzip &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable &&
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            target: rpm
          - distro: arch
            image: archlinux:latest
            setup: >-
              pacman -Syu --noconfirm --needed base-devel curl libarchive &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable &&
              ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/
            target: arch
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: 安装构建依赖
        run: ${{ matrix.setup }}
      - name: 构建 ${{ matrix.target }}
        run: |
          chmod +x packaging/build.sh packaging/*/make-*.sh
          ./packaging/build.sh --out dist ${{ matrix.target }}
      - name: 校验产物
        run: |
          ls -l dist/
          case "${{ matrix.target }}" in
            deb)  dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb ;;
            rpm)  rpm -qip dist/*.rpm && rpm -qlp dist/*.rpm ;;
            arch) bsdtar -tvf dist/*.pkg.tar.zst | head -50 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: asus-numpad-${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error
